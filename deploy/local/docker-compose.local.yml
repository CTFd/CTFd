# Plateforme complete sur UNE machine, pour valider avant AWS.
#
#   cd deploy && make local-up            # CTFd + MariaDB + Redis (+ IA en option)
#   cd deploy && make local-build-images  # images ctf-* des challenges servis
#   cd deploy && make local-seed          # setup, theme hibris, accueil, 36 challenges
#   cd deploy && make local-smoke         # pages, theme, assets, API
#   cd deploy && make local-playtest      # spawn -> solveur -> soumission, par challenge
#
# Differences ASSUMEES avec deploy/front/docker-compose.prod.yml :
#   - pas de nginx/TLS : CTFd ecoute directement sur http://localhost:8000 ;
#   - l'instancier pilote le Docker DE LA MACHINE (socket monte) au lieu de
#     l'arena via ssh, et publie les ports en direct (INSTANCER_PUBLISH=direct)
#     au lieu de passer par frp -> pas de Swarm, pas de dockerproxy ;
#   - ctfd tourne en root pour pouvoir ecrire sur le socket Docker (le compose
#     officiel de CTFd fait pareil en dev) ;
#   - secrets de dev en clair ci-dessous : ils ne servent QUE localement.
#
# Le noeud IA est optionnel (profil `ai`) : Ollama sur CPU + la meme passerelle
# d'admission qu'en prod. Sans le profil, la categorie IA reste visible mais ne
# spawne pas (503 "Passerelle IA non configuree"), comme en prod hors evenement.

services:
  ctfd:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: ctfd-local:latest
    user: root
    restart: unless-stopped
    ports:
      - "${CTFD_PORT:-8000}:8000"
    environment:
      - UPLOAD_FOLDER=/var/uploads
      - DATABASE_URL=mysql+pymysql://ctfd:${DB_PASSWORD:-ctfd}@db/ctfd
      - REDIS_URL=redis://cache:6379
      - SECRET_KEY=${SECRET_KEY:-local-dev-secret-key-not-for-prod}
      - CTF_TEAM_FLAG_SECRET=${CTF_TEAM_FLAG_SECRET:-local-dev-team-flag-secret}
      - WORKERS=${WORKERS:-2}
      - LOG_FOLDER=/var/log/CTFd
      - ACCESS_LOG=-
      - ERROR_LOG=-
      # --- instancier : Docker local, publication directe ---------------
      - DOCKER_HOST=unix:///var/run/docker.sock
      - INSTANCER_PUBLISH=direct
      - FRONT_PUBLIC_IP=${FRONT_PUBLIC_IP:-127.0.0.1}
      - WHALE_PORT_RANGE_START=${WHALE_PORT_RANGE_START:-28000}
      - WHALE_PORT_RANGE_END=${WHALE_PORT_RANGE_END:-28100}
      - INSTANCER_MAX_PER_TEAM=${INSTANCER_MAX_PER_TEAM:-60}
      - INSTANCER_TTL=${INSTANCER_TTL:-3600}
      # --- IA : la passerelle est publiee sur l'hote (8600), comme en prod.
      # Les conteneurs IA la joignent via host.docker.internal (injecte par
      # l'instancier en mode direct).
      - AI_PROXY_URL=${AI_PROXY_URL:-http://host.docker.internal:8600}
      - INSTANCER_OLLAMA_MODEL=${OLLAMA_MODEL:-}
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434}
      # --- King of the Hill (optionnel) : `make local-koth` ---------------
      # Vides par defaut => plugin koth inactif (aucun scoring). `make local-koth`
      # les renseigne et recree ctfd pour activer le scorer. KOTH_GLOBAL_SECRET
      # non defini => le plugin reprend CTF_TEAM_FLAG_SECRET ci-dessus.
      - KOTH_SCORER_SECRET=${KOTH_SCORER_SECRET:-}
      - KOTH_HILLS=${KOTH_HILLS:-}
      - KOTH_TICK=${KOTH_TICK:-15}
    volumes:
      - ctfd_uploads:/var/uploads
      - ctfd_logs:/var/log/CTFd
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started

  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-ctfd-root}
      - MARIADB_USER=ctfd
      - MARIADB_PASSWORD=${DB_PASSWORD:-ctfd}
      - MARIADB_DATABASE=ctfd
      - MARIADB_AUTO_UPGRADE=1
    volumes:
      - db_data:/var/lib/mysql
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --wait_timeout=28800
      - --log-warnings=0
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  cache:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data

  # --- Noeud IA (optionnel) : `make local-up-ai` -------------------------------
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    profiles: ["ai"]
    # deploy:                     # decommenter sur une machine avec GPU NVIDIA
    #   resources:
    #     reservations:
    #       devices:
    #         - capabilities: ["gpu"]

  # Tire le modele une fois (volume persistant), puis s'arrete.
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull "${OLLAMA_MODEL:-llama3.1:8b}"
    volumes:
      - ollama:/root/.ollama
    profiles: ["ai"]
    restart: "no"

  ai-gateway:
    build:
      context: ../ai-gateway
    image: ctfd-ai-gateway:latest
    restart: unless-stopped
    ports:
      - "8600:8600"
    environment:
      - OLLAMA_URL=http://ollama:11434
      # AI_BACKEND=bedrock + identifiants AWS dans l'env de l'operateur :
      # repetition du plan B sans GPU (le conteneur ollama tourne mais est ignore).
      - AI_BACKEND=${AI_BACKEND:-ollama}
      - AI_BEDROCK_MODELS=${AI_BEDROCK_MODELS:-}
      - AI_BEDROCK_CHAT_MODELS=${AI_BEDROCK_CHAT_MODELS:-}
      - AWS_REGION=${AWS_REGION:-eu-west-3}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
      - CTF_TEAM_FLAG_SECRET=${CTF_TEAM_FLAG_SECRET:-local-dev-team-flag-secret}
      - AI_RATE_MAX=${AI_RATE_MAX:-30}
      - AI_TOKEN_BUDGET=${AI_TOKEN_BUDGET:-200000}
      - AI_GLOBAL_INFLIGHT=${AI_GLOBAL_INFLIGHT:-2}
      - AI_LEVEL_MAX=${AI_LEVEL_MAX:-2}
      - AI_LOG_CONTENT=1
    volumes:
      - ai_gateway_logs:/var/log/ai-gateway
    depends_on:
      - ollama
    profiles: ["ai"]

  # --- King of the Hill (optionnel) : `make local-koth` -----------------------
  # Une SEULE colline partagee que toutes les equipes attaquent. CTFd la joint en
  # interne via http://koth-throne:8080 ; l'operateur l'attaque via localhost:28900.
  koth-throne:
    build:
      context: ../../challenges/koth/throne
    image: ctf-koth-throne:latest
    restart: unless-stopped
    environment:
      - SCORER_SECRET=${KOTH_SCORER_SECRET:-local-dev-koth-scorer}
      - SKEW=45
    ports:
      - "127.0.0.1:28900:8080"
    profiles: ["koth"]

  # Colline SSH « root-wars » : entre en SSH (player/player), deviens root, ecris
  # ton jeton dans /koth/king. CTFd lit le vainqueur via le scorer sur :8081.
  koth-citadel:
    build:
      context: ../../challenges/koth/citadel
    image: ctf-koth-citadel:latest
    restart: unless-stopped
    environment:
      - SCORER_SECRET=${KOTH_SCORER_SECRET:-local-dev-koth-scorer}
      - SCORER_PORT=8081
    ports:
      - "127.0.0.1:28901:22"
    profiles: ["koth"]

  # Colline boot2root « The Armory » : SSH (player/player), privesc SUID find,
  # deux fichiers roi -> /home/player/king.txt (user, moitie des points) ou
  # /root/king.txt (root, points pleins). Image construite par `make local-koth`
  # (base + armory), le scorer expose /king sur :8082.
  koth-armory:
    image: ctf-koth-boot2root-armory:latest
    restart: unless-stopped
    environment:
      - SCORER_SECRET=${KOTH_SCORER_SECRET:-local-dev-koth-scorer}
      - SCORER_PORT=8082
    ports:
      - "127.0.0.1:28902:22"
    profiles: ["koth"]

  # Colline economique « Reseau Fortune » (finale) : arene MLM partagee, /king =
  # le reseau le plus riche. Les joueurs rejoignent avec leur jeton KotH
  # (POST /api/join). Image ctf-koth-reseau-fortune, scorer sur :8080 (interne).
  koth-reseau-fortune:
    build:
      context: ../../challenges/koth/reseau-fortune
    image: ctf-koth-reseau-fortune:latest
    restart: unless-stopped
    environment:
      - SCORER_SECRET=${KOTH_SCORER_SECRET:-local-dev-koth-scorer}
    ports:
      - "127.0.0.1:28903:8080"
    profiles: ["koth"]

volumes:
  db_data:
  redis_data:
  ctfd_uploads:
  ctfd_logs:
  ollama:
  ai_gateway_logs:
