name: bridged-protoparse
author: ctf-2026
category: misc
type: team_instance
description: |
  This instance's flag is on the service's filesystem, served by no route.
  Exploit the service to read it.

  Stuck? Hints are available (they cost a few points).

  Flag format: `NCTF{...}`

# Dynamic scoring.
value: 450
extra:
  docker_image: ctf-misc-bridged-protoparse:latest
  internal_port: 8080
  initial: 450
  decay: 25
  minimum: 100

# SERVED challenge; per-team flag, no static flag ships here.
flags:
  - type: team_hmac
    content: misc-bridged-protoparse

# Progressive, point-costing hints. Fill these when the vuln is implemented; the
# CVE id (if any) goes in a paid hint, never in the description.
hints:
  - content: >-
      Le record est [type:1][len:2][value] et le parser te renvoie la valeur. Que se passe-t-il si len dépasse la vraie longueur ?
    cost: 20
    key: h1
  - content: >-
      Lecture hors-borne : le parser fait confiance au champ de longueur sans le borner à la taille réelle. Envoie une petite valeur mais une longueur déclarée trop grande : la réponse déborde sur le buffer voisin où réside le flag.
    cost: 40
    key: h2
    requirements: [h1]

tags:
  - misc
  - medium

# challenge-id (HMAC / requirements wiring): misc-bridged-protoparse
connection_info: "http://{host}:{port}/  (per-team instance; use the 'launch' button)"

state: visible  # IMPLEMENTED + locally verified end-to-end (ported); Lot-5 rehearsal passed 2026-09-23
version: "1.0"
