name: bridged-deser
author: ctf-2026
category: misc
type: team_instance
description: |
  This instance's flag is on the service's filesystem, served by no route.
  Exploit the service to read it.

  Stuck? Hints are available (they cost a few points).

  Flag format: `NCTF{...}`

# Dynamic scoring.
value: 500
extra:
  docker_image: ctf-misc-bridged-deser:latest
  internal_port: 8080
  initial: 500
  decay: 25
  minimum: 100

# SERVED challenge; per-team flag, no static flag ships here.
flags:
  - type: team_hmac
    content: misc-bridged-deser

# Progressive, point-costing hints. Fill these when the vuln is implemented; the
# CVE id (if any) goes in a paid hint, never in the description.
hints:
  - content: >-
      Le fetcher serveur ne restreint pas sa cible. Que peut-il atteindre en interne ?
    cost: 20
    key: h1
  - content: >-
      SSRF vers le RPC interne : le fetcher atteint un endpoint interne qui désérialise ce qu'on lui envoie. Fais-lui instancier la classe qui dumpe le flag.
    cost: 40
    key: h2
    requirements: [h1]

tags:
  - misc
  - medium

# challenge-id (HMAC / requirements wiring): misc-bridged-deser
connection_info: "http://{host}:{port}/  (per-team instance; use the 'launch' button)"

state: visible  # IMPLEMENTED + locally verified end-to-end (ported); flip to visible after Lot-5 Docker rehearsal; Lot-5 rehearsal passed 2026-09-23
version: "1.0"
