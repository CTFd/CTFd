name: secret-slip
author: ctf-2026
category: sysadmin
type: team_instance
description: |
  This instance's flag is on the service's filesystem, served by no route.
  Exploit the service to read it.

  Stuck? Hints are available (they cost a few points).

  Flag format: `NCTF{...}`

# Dynamic scoring.
value: 450
extra:
  docker_image: ctf-sysadmin-secret-slip:latest
  internal_port: 8080
  initial: 450
  decay: 25
  minimum: 100

# SERVED challenge; per-team flag, no static flag ships here.
flags:
  - type: team_hmac
    content: sysadmin-secret-slip

# Progressive, point-costing hints. Fill these when the vuln is implemented; the
# CVE id (if any) goes in a paid hint, never in the description.
hints:
  - content: >-
      Que renvoie /status de trop ? Ce champ devrait-il être secret ?
    cost: 20
    key: h1
  - content: >-
      Lis pending_nonce dans /status, POST /rotate {nonce}, récupère admin_token, GET /admin/flag.
    cost: 40
    key: h2
    requirements: [h1]

tags:
  - sysadmin
  - hard

# challenge-id (HMAC / requirements wiring): sysadmin-secret-slip
connection_info: "http://{host}:{port}/  (per-team instance; use the 'launch' button)"

state: visible  # IMPLEMENTED + locally verified end-to-end; flip to visible after Lot-5 Docker rehearsal; Lot-5 rehearsal passed 2026-09-23
version: "1.0"
