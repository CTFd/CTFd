name: auditd-cap
author: ctf-2026
category: sysadmin
type: team_instance
description: |
  This instance's flag is on the service's filesystem, served by no route.
  Exploit the service to read it.

  Stuck? Hints are available (they cost a few points).

  Flag format: `NCTF{...}`

# Dynamic scoring.
value: 500
extra:
  docker_image: ctf-sysadmin-auditd-cap:latest
  internal_port: 8080
  initial: 500
  decay: 25
  minimum: 100

# SERVED challenge; per-team flag, no static flag ships here.
flags:
  - type: team_hmac
    content: sysadmin-auditd-cap

# Progressive, point-costing hints. Fill these when the vuln is implemented; the
# CVE id (if any) goes in a paid hint, never in the description.
hints:
  - content: >-
      Regarde les capabilities des binaires. Lequel en a une bien trop large ?
    cost: 20
    key: h1
  - content: >-
      Un des binaires porte une capability de lecture qui outrepasse les permissions de fichier (cap_dac_read_search). Sers-t'en pour faire lire le fichier de flag.
    cost: 40
    key: h2
    requirements: [h1]

tags:
  - sysadmin
  - medium

# challenge-id (HMAC / requirements wiring): sysadmin-auditd-cap
connection_info: "http://{host}:{port}/  (per-team instance; use the 'launch' button)"

state: visible  # IMPLEMENTED + locally verified end-to-end (ported); flip to visible after Lot-5 Docker rehearsal; Lot-5 rehearsal passed 2026-09-23
version: "1.0"
