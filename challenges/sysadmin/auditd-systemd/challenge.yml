name: auditd-systemd
author: ctf-2026
category: sysadmin
type: team_instance
description: |
  This instance's flag is on the service's filesystem, served by no route.
  Exploit the service to read it.

  Stuck? Hints are available (they cost a few points).

  Flag format: `NCTF{...}`

# Dynamic scoring.
value: 500
extra:
  docker_image: ctf-sysadmin-auditd-systemd:latest
  internal_port: 8080
  initial: 500
  decay: 25
  minimum: 100

# SERVED challenge; per-team flag, no static flag ships here.
flags:
  - type: team_hmac
    content: sysadmin-auditd-systemd

# Progressive, point-costing hints. Fill these when the vuln is implemented; the
# CVE id (if any) goes in a paid hint, never in the description.
hints:
  - content: >-
      L'unit root lit un env drop-in éditable. La doc ne parle que de LOG_LEVEL — mais est-ce filtré ?
    cost: 20
    key: h1
  - content: >-
      Injection d'environnement systemd : le drop-in d'env éditable n'est pas filtré. Ajoute une variable qui modifie les arguments du service pour lui faire dumper les secrets, puis (re)démarre l'unit.
    cost: 40
    key: h2
    requirements: [h1]

tags:
  - sysadmin
  - medium

# challenge-id (HMAC / requirements wiring): sysadmin-auditd-systemd
connection_info: "http://{host}:{port}/  (per-team instance; use the 'launch' button)"

state: visible  # IMPLEMENTED + locally verified end-to-end (ported); flip to visible after Lot-5 Docker rehearsal; Lot-5 rehearsal passed 2026-09-23
version: "1.0"
