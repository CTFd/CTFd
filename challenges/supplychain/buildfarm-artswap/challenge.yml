name: buildfarm-artswap
author: ctf-2026
category: supplychain
type: team_instance
description: |
  This instance's flag is on the service's filesystem, served by no route.
  Exploit the service to read it.

  Stuck? Hints are available (they cost a few points).

  Flag format: `NCTF{...}`

# Dynamic scoring.
value: 500
extra:
  docker_image: ctf-supplychain-buildfarm-artswap:latest
  internal_port: 8080
  initial: 500
  decay: 25
  minimum: 100

# SERVED challenge; per-team flag, no static flag ships here.
flags:
  - type: team_hmac
    content: supplychain-buildfarm-artswap

# Progressive, point-costing hints. Fill these when the vuln is implemented; the
# CVE id (if any) goes in a paid hint, never in the description.
hints:
  - content: >-
      La provenance est-elle vraiment signée, ou juste des champs que tu peux recopier ?
    cost: 20
    key: h1
  - content: >-
      La provenance n'est pas signée, seulement des champs recopiables : soumets un artefact malveillant (déclenchant l'émission du flag au déploiement) accompagné d'une provenance forgée qui se fait passer pour le builder de confiance.
    cost: 40
    key: h2
    requirements: [h1]

tags:
  - supplychain
  - medium

# challenge-id (HMAC / requirements wiring): supplychain-buildfarm-artswap
connection_info: "http://{host}:{port}/  (per-team instance; use the 'launch' button)"

state: visible  # IMPLEMENTED + locally verified end-to-end; flip to visible after Lot-5 Docker rehearsal; Lot-5 rehearsal passed 2026-09-23
