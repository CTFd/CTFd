name: buildfarm-postinstall
author: ctf-2026
category: supplychain
type: team_instance
description: |
  This instance's flag is on the service's filesystem, served by no route.
  Exploit the service to read it.

  Stuck? Hints are available (they cost a few points).

  Flag format: `NCTF{...}`

# Dynamic scoring.
value: 500
extra:
  docker_image: ctf-supplychain-buildfarm-postinstall:latest
  internal_port: 8080
  initial: 500
  decay: 25
  minimum: 100

# SERVED challenge; per-team flag, no static flag ships here.
flags:
  - type: team_hmac
    content: supplychain-buildfarm-postinstall

# Progressive, point-costing hints. Fill these when the vuln is implemented; the
# CVE id (if any) goes in a paid hint, never in the description.
hints:
  - content: >-
      L'installateur exécute le hook post-install du paquet. Qui peut publier un paquet ici ?
    cost: 20
    key: h1
  - content: >-
      N'importe qui peut publier ici : publie un paquet dont le hook post-install émet le flag, puis fais-le installer — la sortie du hook contient le flag.
    cost: 40
    key: h2
    requirements: [h1]

tags:
  - supplychain
  - medium

# challenge-id (HMAC / requirements wiring): supplychain-buildfarm-postinstall
connection_info: "http://{host}:{port}/  (per-team instance; use the 'launch' button)"

state: visible  # IMPLEMENTED + locally verified end-to-end; flip to visible after Lot-5 Docker rehearsal; Lot-5 rehearsal passed 2026-09-23
version: "1.0"
