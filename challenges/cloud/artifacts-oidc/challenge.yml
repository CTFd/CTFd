name: artifacts-oidc
author: ctf-2026
category: cloud
type: team_instance
description: |
  This instance's flag is on the service's filesystem, served by no route.
  Exploit the service to read it.

  Stuck? Hints are available (they cost a few points).

  Flag format: `NCTF{...}`

# Dynamic scoring.
value: 300
extra:
  docker_image: ctf-cloud-artifacts-oidc:latest
  internal_port: 8080
  initial: 500
  decay: 25
  minimum: 100

# SERVED challenge; per-team flag, no static flag ships here.
flags:
  - type: team_hmac
    content: cloud-artifacts-oidc

# Progressive, point-costing hints. Fill these when the vuln is implemented; the
# CVE id (if any) goes in a paid hint, never in the description.
hints:
  - content: >-
      Le serveur fait confiance au champ alg de l'en-tête du jeton. Que se passe-t-il avec alg=none ?
    cost: 20
    key: h1
  - content: >-
      Le vérificateur accepte alg:none : un jeton dont la signature est vide passe. Reste à te placer, dans la charge utile, dans le groupe privilégié qui débloque le flag.
    cost: 40
    key: h2
    requirements: [h1]

tags:
  - cloud
  - medium

# challenge-id (HMAC / requirements wiring): cloud-artifacts-oidc
connection_info: "http://{host}:{port}/  (per-team instance; use the 'launch' button)"

state: visible  # IMPLEMENTED + locally verified end-to-end (ported); Lot-5 rehearsal passed 2026-09-23
version: "1.0"
