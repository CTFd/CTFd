name: artifacts-envexec
author: ctf-2026
category: cloud
type: team_instance
description: |
  This instance's flag is on the service's filesystem, served by no route.
  Exploit the service to read it.

  Stuck? Hints are available (they cost a few points).

  Flag format: `NCTF{...}`

# Dynamic scoring.
value: 300
extra:
  docker_image: ctf-cloud-artifacts-envexec:latest
  internal_port: 8080
  initial: 500
  decay: 25
  minimum: 100

# SERVED challenge; per-team flag, no static flag ships here.
flags:
  - type: team_hmac
    content: cloud-artifacts-envexec

# Progressive, point-costing hints. Fill these when the vuln is implemented; the
# CVE id (if any) goes in a paid hint, never in the description.
hints:
  - content: >-
      /invoke accepte un objet env. La doc ne liste que LOG_LEVEL et REGION — mais le runtime filtre-t-il vraiment les clés ?
    cost: 20
    key: h1
  - content: >-
      Le runtime ne filtre pas les clés d'env : injecte une clé de hook non documentée. Une valeur invalide fait fuiter le registre des hooks — l'un d'eux est un hook de debug qui révèle le flag.
    cost: 40
    key: h2
    requirements: [h1]

tags:
  - cloud
  - medium

# challenge-id (HMAC / requirements wiring): cloud-artifacts-envexec
connection_info: "http://{host}:{port}/  (per-team instance; use the 'launch' button)"

state: visible  # IMPLEMENTED + locally verified end-to-end (ported); flip to visible after Lot-5 Docker rehearsal; Lot-5 rehearsal passed 2026-09-23
version: "1.0"
