name: artifacts-imds
author: ctf-2026
category: cloud
type: team_instance
description: |
  This instance's flag is on the service's filesystem, served by no route.
  Exploit the service to read it.

  Stuck? Hints are available (they cost a few points).

  Flag format: `NCTF{...}`

# Dynamic scoring.
value: 300
extra:
  docker_image: ctf-cloud-artifacts-imds:latest
  internal_port: 8080
  initial: 500
  decay: 25
  minimum: 100

# SERVED challenge; per-team flag, no static flag ships here.
flags:
  - type: team_hmac
    content: cloud-artifacts-imds

# Progressive, point-costing hints. Fill these when the vuln is implemented; the
# CVE id (if any) goes in a paid hint, never in the description.
hints:
  - content: >-
      Le fetcher de manifests ne bloque pas toutes les adresses. Quelle adresse spéciale un service cloud expose-t-il en interne ?
    cost: 20
    key: h1
  - content: >-
      SSRF vers l'IMDS du cloud : fais fetcher l'adresse de métadonnées interne pour récupérer les credentials d'un rôle, puis rejoue ce jeton de rôle sur l'accès aux objets protégés.
    cost: 40
    key: h2
    requirements: [h1]

tags:
  - cloud
  - medium

# challenge-id (HMAC / requirements wiring): cloud-artifacts-imds
connection_info: "http://{host}:{port}/  (per-team instance; use the 'launch' button)"

state: visible  # IMPLEMENTED + locally verified end-to-end (ported); Lot-5 rehearsal passed 2026-09-23
version: "1.0"
