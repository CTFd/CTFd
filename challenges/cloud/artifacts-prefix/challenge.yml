name: artifacts-prefix
author: ctf-2026
category: cloud
type: team_instance
description: |
  This instance's flag is on the service's filesystem, served by no route.
  Exploit the service to read it.

  Stuck? Hints are available (they cost a few points).

  Flag format: `NCTF{...}`

# Dynamic scoring.
value: 300
extra:
  docker_image: ctf-cloud-artifacts-prefix:latest
  internal_port: 8080
  initial: 450
  decay: 25
  minimum: 100

# SERVED challenge; per-team flag, no static flag ships here.
flags:
  - type: team_hmac
    content: cloud-artifacts-prefix

# Progressive, point-costing hints. Fill these when the vuln is implemented; the
# CVE id (if any) goes in a paid hint, never in the description.
hints:
  - content: >-
      Le préfixe public/ est listable. Que traîne-t-il dans les objets publics ?
    cost: 20
    key: h1
  - content: >-
      Un objet du préfixe public traîne un secret de déploiement. Sers-t'en pour assumer un rôle, puis lis l'objet privé avec le jeton obtenu.
    cost: 40
    key: h2
    requirements: [h1]

tags:
  - cloud
  - medium

# challenge-id (HMAC / requirements wiring): cloud-artifacts-prefix
connection_info: "http://{host}:{port}/  (per-team instance; use the 'launch' button)"

state: visible  # IMPLEMENTED + locally verified end-to-end (ported); Lot-5 rehearsal passed 2026-09-23
version: "1.0"
