name: jwt-cousin
author: ctf-2026
category: web
description: |
  "It's basically a JWT," said no one who read the code.

  **Cousin SSO** issues bearer tokens for the operations console. Log in with
  a public account and you get read-only `guest` access. The console only hands
  back the operations flag once an **admin** performs a console rotation -- so
  you'll need an `admin` token you were never issued.

  Auth surface:

      POST /api/login          {"user": "...", "pass": "..."}
      GET  /api/whoami         verifies a token (no admin needed)
      POST /api/admin/rotate   admin-only; emits the flag on success

  Public demo accounts: `guest`/`guest` and `staff`/`staff`. The `admin`
  password is not public -- you are meant to forge an admin token, not log in
  as one.

  The service is the oracle: nothing here is a downloadable flag. The flag is
  emitted by the server only after the admin-only rotation succeeds.

  Stuck? Hints are available (they cost a few points).

  Flag format: `NCTF{...}`

value: 150
type: team_instance
extra:
  docker_image: ctf-jwt-cousin:latest
  internal_port: 8080
  initial: 150
  decay: 25
  minimum: 50

# This challenge is served per-team. The flag is dynamic:
#   flag = "NCTF{" + HMAC_SHA256(TEAM_SECRET, "web-jwt-cousin")[:24] + "}"
# and is emitted by the running instance after the admin effect. The static
# flag below is a placeholder for the demo TEAM_SECRET used in local builds;
# CTFd validates the real per-team flag via the custom HMAC flag class, so no
# static flag is shipped to production.
flags:
  - type: team_hmac
    content: web-jwt-cousin

# Progressive, point-costing hints. The vuln detail lives here, not in the
# description: it has to be paid for.
hints:
  - content: >-
      It looks JWT-ish, but it isn't a JWT: two segments `<payload>.<sig>`, no
      header, and the signature is not an HMAC over the base64 segments. Stock
      JWT tricks (`alg:none`, key confusion, jwt.io) are all dead ends -- the
      server ignores `alg`. Ask a different question instead: what does the
      signature actually cover?
    cost: 10
    key: h1
  - content: >-
      The signature is over a canonical string the server rebuilds from a fixed
      subset of the claims. Probe one claim at a time against `/api/whoami`
      (change it, keep the original signature): some changes are rejected, one
      of them still verifies.
    cost: 15
    key: h2
    requirements: [h1]
  - content: >-
      `role` is outside the signed data (the canonical string is
      `sub=...;exp=...;v=...`). Take a valid `guest` token, edit the payload
      JSON to `"role":"admin"`, re-attach the unchanged signature, and POST it
      to `/api/admin/rotate`.
    cost: 25
    key: h3
    requirements: [h2]

tags:
  - web
  - easy

# challenge-id (for HMAC / requirements wiring): web-jwt-cousin
# No prerequisites; standalone.

connection_info: "http://{host}:{port}/  (per-team instance; use the 'launch' button)"

state: visible
version: "0.1"

# Served challenge -- image must be named ctf-jwt-cousin:latest so
# `make push-images` finds it.
