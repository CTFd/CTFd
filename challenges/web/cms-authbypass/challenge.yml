name: cms-authbypass
author: ctf-2026
category: web
type: team_instance
description: |
  This instance's flag is on the service's filesystem, served by no route.
  Exploit the service to read it.

  Stuck? Hints are available (they cost a few points).

  Flag format: `NCTF{...}`

# Dynamic scoring.
value: 450
extra:
  docker_image: ctf-web-cms-authbypass:latest
  internal_port: 8080
  initial: 450
  decay: 25
  minimum: 100

# SERVED challenge; per-team flag, no static flag ships here.
flags:
  - type: team_hmac
    content: web-cms-authbypass

# Progressive, point-costing hints. Fill these when the vuln is implemented; the
# CVE id (if any) goes in a paid hint, never in the description.
hints:
  - content: >-
      L'API admin te refuse (403). Sur quoi se base-t-elle pour décider que tu es admin ?
    cost: 20
    key: h1
  - content: >-
      Contrôle d'accès cassé : l'autorisation se fie à un en-tête fourni par le client, et l'API de mise à jour de compte accepte un champ de rôle non filtré (mass-assignment). Combine les deux pour te promouvoir admin.
    cost: 40
    key: h2
    requirements: [h1]

tags:
  - web
  - medium

# challenge-id (HMAC / requirements wiring): web-cms-authbypass
connection_info: "http://{host}:{port}/  (per-team instance; use the 'launch' button)"

state: visible  # IMPLEMENTED + locally verified end-to-end (ported); Lot-5 rehearsal passed 2026-09-23
