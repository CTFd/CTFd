name: forum-protopoll
author: ctf-2026
category: web
type: team_instance
description: |
  This instance's flag is on the service's filesystem, served by no route.
  Exploit the service to read it.

  Stuck? Hints are available (they cost a few points).

  Flag format: `NCTF{...}`

# Dynamic scoring.
value: 500
extra:
  docker_image: ctf-web-forum-protopoll:latest
  internal_port: 8080
  initial: 500
  decay: 25
  minimum: 100

# SERVED challenge; per-team flag, no static flag ships here.
flags:
  - type: team_hmac
    content: web-forum-protopoll

# Progressive, point-costing hints. Fill these when the vuln is implemented; the
# CVE id (if any) goes in a paid hint, never in the description.
hints:
  - content: >-
      Le merge des settings filtre-t-il les clés qu'on peut introduire ?
    cost: 20
    key: h1
  - content: >-
      Le merge des settings ne filtre pas les clés : injecte une clé de configuration non prévue qui installe un hook de rendu émettant le flag, puis déclenche le rendu.
    cost: 40
    key: h2
    requirements: [h1]

tags:
  - web
  - medium

# challenge-id (HMAC / requirements wiring): web-forum-protopoll
connection_info: "http://{host}:{port}/  (per-team instance; use the 'launch' button)"

state: visible  # IMPLEMENTED + locally verified end-to-end; flip to visible after Lot-5 Docker rehearsal; Lot-5 rehearsal passed 2026-09-23
version: "1.0"
