hints:
  - content: >-
      Le contrôle d'extension se fie-t-il au nom déclaré ? Et le rendu suit-il des URL ?
    cost: 20
    key: h1
  - content: >-
      Le filtre d'extension se fie au nom déclaré (double extension) et le rendu suit les URL : uploade un fichier qui passe le filtre, puis fais pointer le rendu vers l'endpoint interne qui sert le flag.
    cost: 40
    key: h2
    requirements: [h1]

