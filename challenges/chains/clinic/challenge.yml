name: clinic
author: ctf-2026
category: chains
type: team_instance
description: |
  This instance's flag is on the service's filesystem, served by no route.
  Exploit the service to read it.

  Stuck? Hints are available (they cost a few points).

  Flag format: `NCTF{...}`

# Dynamic scoring.
value: 450
extra:
  docker_image: ctf-chains-clinic:latest
  internal_port: 8080
  initial: 450
  decay: 25
  minimum: 100

# SERVED challenge; per-team flag, no static flag ships here.
flags:
  - type: team_hmac
    content: chains-clinic

# Progressive, point-costing hints. Fill these when the vuln is implemented; the
# CVE id (if any) goes in a paid hint, never in the description.
hints:
  - content: >-
      Le sid renvoyé au login est-il aléatoire ? Et /export vérifie-t-il la propriété ?
    cost: 20
    key: h1
  - content: >-
      Les sid sont séquentiels (admin=1). /export?sid=1 (IDOR) fuite l'admin api_key -> POST /admin/rotate {key}.
    cost: 40
    key: h2
    requirements: [h1]

tags:
  - chains
  - hard

# challenge-id (HMAC / requirements wiring): chains-clinic
connection_info: "http://{host}:{port}/  (per-team instance; use the 'launch' button)"

state: visible  # IMPLEMENTED + locally verified end-to-end; flip to visible after Lot-5 Docker rehearsal; Lot-5 rehearsal passed 2026-09-23
version: "1.0"
