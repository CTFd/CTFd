hints:
  - content: >-
      /whoami ne réagit pas pareil selon que le déchiffrement a un padding valide ou non. Que peux-tu apprendre d'un seul bit fuité ?
    cost: 20
    key: h1
  - content: >-
      Oracle de padding AES-CBC : le bit fuité par /whoami permet de récupérer l'état intermédiaire octet par octet, sans la clé. De là, fabrique (CBC-R) un cryptogramme qui déchiffre vers le rôle admin.
    cost: 40
    key: h2
    requirements: [h1]

