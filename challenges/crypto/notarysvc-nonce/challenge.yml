name: notarysvc-nonce
author: ctf-2026
category: crypto
type: team_instance
description: |
  This instance's flag is on the service's filesystem, served by no route.
  Exploit the service to read it.

  Stuck? Hints are available (they cost a few points).

  Flag format: `NCTF{...}`

# Dynamic scoring.
value: 450
extra:
  docker_image: ctf-crypto-notarysvc-nonce:latest
  internal_port: 8080
  initial: 450
  decay: 25
  minimum: 100

# SERVED challenge; per-team flag, no static flag ships here.
flags:
  - type: team_hmac
    content: crypto-notarysvc-nonce

# Progressive, point-costing hints. Fill these when the vuln is implemented; the
# CVE id (if any) goes in a paid hint, never in the description.
hints:
  - content: >-
      Compare deux signatures renvoyées par /sign. Que remarques-tu sur la valeur r ?
    cost: 20
    key: h1
  - content: >-
      Nonce ECDSA réutilisé : deux signatures au même r partagent le même k, ce qui suffit à remonter à la clé privée. Une fois d récupérée, signe toi-même la commande admin.
    cost: 40
    key: h2
    requirements: [h1]

tags:
  - crypto
  - medium

# challenge-id (HMAC / requirements wiring): crypto-notarysvc-nonce
connection_info: "http://{host}:{port}/  (per-team instance; use the 'launch' button)"

