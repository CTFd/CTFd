<form id="challenge-module-form">
	<div class="form-group">
		<label for="challenge-module-select">
			Modules
			<br>
			<small class="form-text text-muted">
				Challenges in modules are visible only to members of audiences linked to at least one of those modules. Select none to keep the challenge visible to everyone.
			</small>
		</label>
		<select class="form-control w-100" id="challenge-module-select" name="module_ids" multiple size="8">
		</select>
		<small class="form-text text-muted">Ctrl/Cmd-click to select multiple.</small>
	</div>
	<button type="submit" class="btn btn-primary">Save</button>
</form>

<script>
window.addEventListener("load", function() {
	const select = document.getElementById("challenge-module-select");
	const current = {{ challenge.module_ids | tojson }};

	(async function() {
		try {
			const r = await CTFd.fetch("/api/v1/modules", {credentials: "same-origin"});
			const data = await r.json();
			if (data.success) {
				for (const m of data.data) {
					const opt = document.createElement("option");
					opt.value = m.id;
					opt.textContent = m.name + " (#" + m.id + ")";
					if (current.includes(m.id)) opt.selected = true;
					select.appendChild(opt);
				}
			}
		} catch (e) { console.error(e); }
	})();

	document.getElementById("challenge-module-form").addEventListener("submit", async function(e) {
		e.preventDefault();
		const value = Array.from(select.selectedOptions, (opt) => parseInt(opt.value, 10));
		const r = await CTFd.fetch("/api/v1/challenges/" + CHALLENGE_ID, {
			method: "PATCH", credentials: "same-origin",
			body: JSON.stringify({module_ids: value}),
		});
		const data = await r.json();
		if (data.success) {
			window.location.reload();
		} else {
			alert(JSON.stringify(data.errors));
		}
	});
});
</script>
